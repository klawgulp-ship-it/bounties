site_name: FL0X Wiki
site_description: Official FL0X project documentation
site_author: FL0X Community

nav:
  - Home: index.md
  - Proposal: proposal.md
  - Bounties:
    - Active Bounties: bounties/active.md
    - Paid Bounties: bounties/paid.md
  - FL0X Token:
    - How to Add FL0X Token: token/add-fl0x.md

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.tabbed
